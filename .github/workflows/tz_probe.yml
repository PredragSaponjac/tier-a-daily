name: TEMP timezone-schedule probe (delete after one run)

# TEMPORARY (2026-10-04). Verifies that GitHub honours `timezone:` on schedules before the
# scan workflows rely on it. 18:07 America/New_York = 22:07 UTC today. If it fires near
# 22:07 UTC the key works; if read as UTC it would not fire today at all.
on:
  schedule:
    - cron: '7 18 * * *'
      timezone: "America/New_York"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "fired at UTC: $(date -u +%FT%TZ)"
          echo "fired at ET:  $(TZ=America/New_York date +%FT%T%Z)"
