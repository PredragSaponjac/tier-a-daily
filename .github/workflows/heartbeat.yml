name: Heartbeat - alert if the scanner goes silent
on:
  schedule:
    - cron: '30 21 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Check exact stored PM generation and decision
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
        run: python db_state.py health
      - name: Alert on failed health check
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from alert import send_telegram
          if not send_telegram('🚨 TIER A HEARTBEAT: the completed-session PM decision or its verified database generation is missing or unhealthy. Check the Actions logs.'):
              raise SystemExit('Heartbeat transport failed or is not configured')
          PY
