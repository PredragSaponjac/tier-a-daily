name: Preflight - verify code paths before they ship

# Behavioral regressions run offline; preflight validates configuration and wiring.
# Runtime gates and durability checks fail closed inside the production jobs.

on:
  push:
    branches: [master]
    paths:
      - '**.py'
      - '.github/workflows/*.yml'
      - 'parameters.json'
      - 'hypotheses.json'
      - 'inference_protocol_lock.json'
      - 'requirements.txt'
  schedule:
    - cron: '0 9 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v

      - name: Run preflight
        id: pf
        env:
          SKEW_DB_PATH: ./skew_history.db
        run: python preflight.py

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="🔧 PREFLIGHT FAILED on tier-a-daily — a code path or wiring check is broken. Trading is NOT blocked, but signals/posts may misbehave. Check the Actions tab." >/dev/null || true
          fi
