name: Weekly self-audit - score registered hypotheses, never implement
on:
  schedule:
    - cron: '30 18 * * 5'
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: tier-a-db-writer
      cancel-in-progress: false
      queue: max
    outputs:
      record_ready: ${{ steps.transfer.outcome }}
    env:
      GH_TOKEN: ${{ github.token }}
      DB_STATE_SERIALIZED: github-actions:tier-a-db-writer
      DURABLE_STATE_CHECKPOINT: git
      SKEW_DB_PATH: ./skew_history.db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch database state
        id: pull
        run: bash db_state.sh pull
      - name: Label the path of every Tier A qualifier
        id: label
        run: python path_labels.py
      - name: Score the hypothesis registry and report
        id: score
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python self_audit.py --send --json
      - name: Store database state even if reporting failed
        # A failed label batch rolls back rows, but CREATE/ALTER migrations that
        # preceded its DML transaction survive. Verify and retain that valid DB.
        if: always() && steps.pull.outcome == 'success' && (steps.label.outcome == 'success' || steps.label.outcome == 'failure')
        run: bash db_state.sh push
      - name: Transfer audit records even if reporting failed
        id: transfer
        if: always() && steps.score.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit_latest.json
            audit_history/
            inference_checkpoints/
          retention-days: 1
          if-no-files-found: error
      - name: Preserve failed audit evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-audit-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit_latest.json
            .db_generation.json
          include-hidden-files: true
          retention-days: 14

  persist_record:
    needs: audit
    if: always() && !cancelled() && needs.audit.outputs.record_ready == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: tier-a-portfolio-writer
      cancel-in-progress: false
      queue: max
    env:
      DURABLE_STATE_CHECKPOINT: git
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh Git state (fail closed)
        run: git pull --ff-only origin "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          name: weekly-records-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit the audit record
        run: python -c "from state_lock import checkpoint; checkpoint(['audit_latest.json', 'audit_history', 'inference_checkpoints'])"
