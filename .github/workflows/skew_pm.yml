name: Skew PM - auto scan, label, scanner, signal

# Completed daily bars are reviewed for paper entry at the NEXT regular open.
# Timezone and queue:max are supported GitHub Actions syntax (official docs).
on:
  schedule:
    - cron: '5 16 * * 1-5'
      timezone: America/New_York
    - cron: '15 17 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scan locally; no sends, commits or release writes'
        type: boolean
        default: false
      scan_date_override:
        description: 'Read-only replay YYYY-MM-DD; no scan, sends or writes'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    concurrency:
      group: tier-a-db-writer
      cancel-in-progress: false
      queue: max
    outputs:
      ready: ${{ steps.transfer.outputs.ready }}
      write: ${{ steps.guard.outputs.write }}
      replay_date: ${{ steps.guard.outputs.replay_date }}
      date: ${{ steps.guard.outputs.date }}
    env:
      GH_TOKEN: ${{ github.token }}
      DB_STATE_SERIALIZED: github-actions:tier-a-db-writer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Session and duplicate guard
        id: guard
        env:
          DRY: ${{ inputs.dry_run }}
          REPLAY: ${{ inputs.scan_date_override }}
        run: |
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          from market_time import is_session, now_eastern, session_completed
          day = now_eastern().date().isoformat()
          replay = os.environ.get('REPLAY', '')
          dry = os.environ.get('DRY') == 'true'
          skip = False
          if replay:
              datetime.date.fromisoformat(replay)
          elif not is_session(day) or not session_completed(day):
              print('No completed regular session today; skipping.')
              skip = True
          elif not dry and Path('last_scan_pm.json').exists():
              marker = json.loads(Path('last_scan_pm.json').read_text())
              skip = marker.get('latest_scan_date') == day
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'skip={str(skip).lower()}\nwrite={str(not skip and not dry and not replay).lower()}\n')
              out.write(f'replay_date={replay}\ndate={replay or day}\n')
          PY
      - name: Fetch database state
        if: steps.guard.outputs.skip != 'true'
        run: bash db_state.sh pull
      - name: Run skew_tracker.py (PM scan)
        id: scan
        if: steps.guard.outputs.skip != 'true' && steps.guard.outputs.replay_date == ''
        run: |
          if python skew_tracker.py > skew_manual_pm.log 2>&1; then
            tail -10 skew_manual_pm.log
          else
            rc=$?; tail -60 skew_manual_pm.log; exit "$rc"
          fi
      # Research labels never decide today's signal. A label failure shows as a failed
      # step, but must not fail this job: the PM completion marker requires this job to
      # succeed, so one bad ticker used to mean no marker, a pointless 17:15 rerun and a
      # nightly heartbeat alarm (review 2026-10-04).
      - name: Run label_candidates.py
        id: label
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        run: python label_candidates.py
      # Always preserve a successful scan even if a later research stage fails.
      - name: Store database state
        id: store
        if: always() && steps.guard.outputs.write == 'true' && steps.scan.outcome == 'success'
        run: bash db_state.sh push
      - name: Prepare exact generation for decision runner
        id: transfer
        if: always() && steps.guard.outputs.skip != 'true' && ((steps.guard.outputs.write == 'true' && steps.store.outcome == 'success') || (steps.guard.outputs.write == 'false' && (steps.scan.outcome == 'success' || steps.guard.outputs.replay_date != '')))
        run: |
          mkdir -p transfer
          cp .db_generation.json transfer/.db_generation.json
          if [ '${{ steps.guard.outputs.write }}' != 'true' ] && [ -z '${{ steps.guard.outputs.replay_date }}' ]; then
            cp skew_history.db transfer/skew_history.db
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Transfer scan generation
        if: always() && steps.transfer.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: decision-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: transfer/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Preserve scan failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pm-scan-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            skew_manual_pm.log
            .db_generation.json
          include-hidden-files: true
          retention-days: 14

  signal:
    needs: prepare
    if: always() && !cancelled() && needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Only this short transaction and monitor own the portfolio queue. Long scans
    # cannot keep the close monitor waiting for an hour.
    concurrency:
      group: tier-a-portfolio-writer
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      WRITE: ${{ needs.prepare.outputs.write }}
      REPLAY_DATE: ${{ needs.prepare.outputs.replay_date }}
      SKEW_DB_PATH: ./skew_history.db
      DURABLE_STATE_CHECKPOINT: ${{ needs.prepare.outputs.write == 'true' && 'git' || 'local' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: decision-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: transfer
      - name: Fetch exact prepared database state
        run: |
          if [ -f transfer/skew_history.db ]; then
            cp transfer/skew_history.db skew_history.db
            cp transfer/.db_generation.json .db_generation.json
          else
            GEN=$(python -c "import json; print(json.load(open('transfer/.db_generation.json'))['name'])")
            DB_STATE_PULL_GENERATION="$GEN" bash db_state.sh pull
          fi
      - name: Refresh portfolio state (fail closed)
        run: git pull --ff-only origin "$GITHUB_REF_NAME"
      - name: Run Tier A Daily bot
        id: signal
        env:
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GOOGLE_SHEETS_CREDS_BASE64: ${{ secrets.GOOGLE_SHEETS_CREDS_BASE64 }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          ENABLE_X_AUTOPOST: '1'
        run: |
          if [ -n "$REPLAY_DATE" ]; then
            python main.py --scan-date "$REPLAY_DATE"
          elif [ "$WRITE" != 'true' ]; then
            python main.py --require-today --dry-run
          else
            python main.py --require-today
          fi
      - name: Persist the decision record even on delivery failure
        id: persist
        if: always() && env.WRITE == 'true' && steps.signal.outcome != 'skipped'
        run: python state_lock.py checkpoint
      - name: Verify today's data landed
        id: verify
        if: always() && env.WRITE == 'true' && steps.signal.outcome != 'skipped'
        run: python verify_daily.py '${{ needs.prepare.outputs.date }}'
      - name: Mark the PM pipeline complete
        if: success() && env.WRITE == 'true' && needs.prepare.result == 'success'
        run: |
          python scan_marker.py PM --date '${{ needs.prepare.outputs.date }}'
          python state_lock.py checkpoint
      - name: Preserve failed delivery evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pm-delivery-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            signals/
            open_positions.json
            closed_trades.json
            x_drafts/
            x_posted.log
            .db_generation.json
          include-hidden-files: true
          retention-days: 14
