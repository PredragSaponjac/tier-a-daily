name: Skew PM - auto scan + label + scanner + signal

# Trigger:
#  - 19:45 UTC = 2:45 PM CDT (Mar-Nov), Mon-Fri
#    DST: Nov 2, 2026 — shift to 20:45 UTC (2:45 PM CST)
#  - Manual via Actions tab
on:
  # Native `schedule:` was REMOVED 2026-06-15 because it fired ~1hr late AND duplicated
  # cron-job.org, running the PM bot TWICE and sending TWO signals/day (NNE on-time +
  # ADSK from the late run). But that left cron-job.org as the SOLE trigger, and when its
  # PAT expired ~2026-06-28 the scanner died silently for 17 trading days (6/27-7/17).
  # RE-ADDED 2026-07-20 *with* the `guard` job below, which skips the run if a PM snapshot
  # was already committed today — so we get redundancy WITHOUT the double-signal bug.
  schedule:
    - cron: '45 19 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Telegram/X send, no commit)'
        type: boolean
        default: false
      scan_date_override:
        description: 'Override scan_date for main.py (YYYY-MM-DD, empty = use today)'
        required: false
        default: ''

jobs:
  # Dupe guard: the PM run SENDS SIGNALS, so it must never run twice in one day.
  # If cron-job.org already fired and committed today's PM snapshot, skip this run.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - id: check
        run: |
          # Guard on the DATA, not on a commit message (changed 2026-08-28).
          # The old version grepped the git log for "Skew tracker snapshot $TODAY PM".
          # A manual re-run at 22:09 CDT Thursday is 03:09 UTC FRIDAY, so it wrote a
          # Friday-dated commit holding Thursday's closes — which would then have made
          # this guard skip Friday's real scan. last_scan_pm.json records the actual
          # latest scan_date in the database, so the guard now reflects reality.
          # US/Eastern, not UTC: the trading day is what matters, and after ~20:00 ET
          # the UTC date has already rolled into tomorrow.
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          LAST=$(python -c "import json;print(json.load(open('last_scan_pm.json'))['latest_scan_date'])" 2>/dev/null || echo "none")
          echo "trading day (ET): $TODAY   last PM scan in db: $LAST"
          if [ "$LAST" = "$TODAY" ]; then
            echo "PM scan for $TODAY already in the database — skipping duplicate run."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "No PM scan yet for $TODAY — proceeding."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  scan_and_signal:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tier-a-daily
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      # skew_history.db is a RELEASE ASSET, not a git file — it crossed GitHub's
      # 100MB limit on 2026-08-25 and every push was silently rejected for 3 days.
      # HARD-FAILS if the DB is missing/truncated: never scan on an empty database.
      - name: Fetch database state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash db_state.sh pull

      # ===== STEP 1: PM SCAN =====
      - name: Run skew_tracker.py (PM scan)
        run: |
          python skew_tracker.py > skew_manual_pm.log 2>&1
          echo "Scan complete. Tail of log:"
          tail -10 skew_manual_pm.log

      - name: Commit PM snapshot
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "tier-a-daily-bot"
          git config user.email "bot@tieradaily.local"
          python scan_marker.py PM
          git add last_scan_pm.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Skew tracker snapshot $DATE PM (auto)"

      # ===== STEP 2: LABEL FORWARD RETURNS =====
      - name: Run label_candidates.py
        run: |
          python label_candidates.py
          echo "Labeling complete"

      - name: Commit PM labels
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          git diff --cached --quiet || git commit -m "Label candidates forward returns $DATE PM (auto)"
          git push || (git pull --rebase --autostash && git push) || { echo '::error::git push FAILED after retry - data NOT persisted'; exit 1; }

      # ===== STEP 3: SCANNER + FILTER + ALERTS (the bot) =====
      - name: Run Tier A Daily bot (scanner + UW filter + Telegram + X + Sheet)
        env:
          SKEW_DB_PATH: ./skew_history.db
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GOOGLE_SHEETS_CREDS_BASE64: ${{ secrets.GOOGLE_SHEETS_CREDS_BASE64 }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          # X AUTO-POSTING RE-ENABLED 2026-08-03 (user decision). It was gated off
          # 2026-06-15 after the RUM incident (a micro-cap whose skew flipped bearish
          # intraday auto-published). Since then three hard gates were added that would
          # each have blocked RUM: the >=1-strong-leg gate (legs.py), the chain-noise
          # gate (data_quality.py), and the below-put-wall disqualifier. Drafts are still
          # written to x_drafts/ (now committed) so every post has an auditable record.
          # To gate it off again, set this to '0'.
          ENABLE_X_AUTOPOST: '1'
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.scan_date_override }}" ]; then
            ARGS="$ARGS --scan-date ${{ github.event.inputs.scan_date_override }}"
          else
            ARGS="$ARGS --require-today"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python main.py $ARGS

      # DATA-LANDING CHECK (wired 2026-09-02). verify_daily.py existed since 7/31 but was
      # never called by any workflow — it only ran when someone remembered to run it by
      # hand. It asserts today's rows actually exist (skew_daily, candidate_log,
      # fixed_strike_vol, sector_iv_rank populated, archive written). Non-blocking for
      # the signal (that already went out); it fails the RUN so the failure is visible.
      - name: Verify today's data landed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SKEW_DB_PATH: ./skew_history.db
        run: python verify_daily.py "$(TZ=America/New_York date +%Y-%m-%d)"

      - name: Commit archive state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # ONE git add PER PATH (fixed 2026-07-28): a single multi-path add is all-or-
          # nothing — track_record.csv is gitignored (and usually absent in this runner),
          # which made `git add signals/ ... track_record.csv` FATAL and stage NOTHING,
          # so signals/ archives were written but never committed (zero ever, since
          # launch). The 2>/dev/null || true swallowed the fatal for two months.
          # track_record.csv dropped from the list: it is gitignored by design.
          git add signals/ 2>/dev/null || true
          git add x_drafts/ 2>/dev/null || true
          git add open_positions.json 2>/dev/null || true
          git add closed_trades.json 2>/dev/null || true
          git add x_posted.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Daily archive $(date -u +%Y-%m-%d)"
          git push || (git pull --rebase --autostash && git push) || { echo '::error::git push FAILED after retry - data NOT persisted'; exit 1; }

      # Persist the DB back to the release — the ONLY durable copy now.
      - name: Store database state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash db_state.sh push
