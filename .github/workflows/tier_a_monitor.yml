name: Tier A Daily - intraday monitor
# Paper decisions use completed regular-session daily bars. The name is retained
# for existing links; two after-close checks replace unsupported intraday fills.
on:
  schedule:
    - cron: '15 16 * * 1-5'
      timezone: America/New_York
    - cron: '30 17 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: tier-a-portfolio-writer
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      DURABLE_STATE_CHECKPOINT: git
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Refresh portfolio state (fail closed)
        run: git pull --ff-only origin "$GITHUB_REF_NAME"
      # monitor validates both records even with zero positions, and flushes only
      # safely retryable outboxes. Ambiguous sends require human reconciliation.
      - name: Run monitor
        id: monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GOOGLE_SHEETS_CREDS_BASE64: ${{ secrets.GOOGLE_SHEETS_CREDS_BASE64 }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          ENABLE_X_AUTOPOST: '1'
        run: python monitor.py
      - name: Persist state even on delivery failure
        if: always() && steps.monitor.outcome != 'skipped'
        run: python state_lock.py checkpoint
      - name: Preserve failed monitor evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            open_positions.json
            closed_trades.json
            x_drafts/
            x_posted.log
          retention-days: 14
