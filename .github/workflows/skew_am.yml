name: Skew AM - auto scan and label
on:
  schedule:
    - cron: '30 10 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scan locally; no release or Git writes'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    concurrency:
      group: tier-a-db-writer
      cancel-in-progress: false
      queue: max
    outputs:
      marker_ready: ${{ steps.marker.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
      DB_STATE_SERIALIZED: github-actions:tier-a-db-writer
      DURABLE_STATE_CHECKPOINT: git
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Session guard
        id: guard
        run: |
          python - <<'PY'
          import os
          from market_time import is_session, now_eastern
          day = now_eastern().date().isoformat()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'scan={str(is_session(day)).lower()}\ndate={day}\n')
          PY
      - name: Fetch database state
        if: steps.guard.outputs.scan == 'true'
        run: bash db_state.sh pull
      - name: Run skew_tracker.py (AM scan)
        id: scan
        if: steps.guard.outputs.scan == 'true'
        run: |
          if python skew_tracker.py > skew_manual_am.log 2>&1; then
            tail -10 skew_manual_am.log
          else
            rc=$?; tail -60 skew_manual_am.log; exit "$rc"
          fi
      # Research labels are not an input to any decision: a failure is visible but does
      # not block storing the scan or the AM marker (review 2026-10-04).
      - name: Run label_candidates.py
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        run: python label_candidates.py
      - name: Store database state
        id: store
        if: always() && inputs.dry_run != true && steps.scan.outcome == 'success'
        run: bash db_state.sh push
      - name: Prepare AM snapshot marker
        id: marker
        if: success() && inputs.dry_run != true && steps.store.outcome == 'success'
        run: |
          python scan_marker.py AM --date '${{ steps.guard.outputs.date }}'
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Transfer final AM marker
        if: steps.marker.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: am-marker-${{ github.run_id }}-${{ github.run_attempt }}
          path: last_scan_am.json
          retention-days: 1
          if-no-files-found: error
      - name: Preserve scan failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: am-scan-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            skew_manual_am.log
            .db_generation.json
          include-hidden-files: true
          retention-days: 14

  persist_marker:
    needs: scan
    if: needs.scan.outputs.marker_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: tier-a-portfolio-writer
      cancel-in-progress: false
      queue: max
    env:
      DURABLE_STATE_CHECKPOINT: git
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh Git state (fail closed)
        run: git pull --ff-only origin "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          name: am-marker-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit AM snapshot marker
        run: python -c "from state_lock import checkpoint; checkpoint(['last_scan_am.json'])"
