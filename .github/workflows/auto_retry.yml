name: Auto-retry failed scans
# One dispatch per failed scheduled run. Dispatch failures cannot recursively
# trigger another retry. The guarded PM backup is a separate recovery path.
# Historical '+' workflow names were suspected, not established as the cause
# of missing runs; skipped workflow_run events do not prove recovery works.
on:
  workflow_run:
    workflows:
      - 'Skew AM - auto scan and label'
      - 'Skew PM - auto scan, label, scanner, signal'
    types: [completed]
permissions:
  actions: write
  contents: read
jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notification dependency
        run: python -m pip install requests
      - name: Re-dispatch the failed scan once
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          WF_PATH: ${{ github.event.workflow_run.path }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          WF_FILE=$(basename "$WF_PATH")
          case "$WF_FILE" in
            skew_am.yml|skew_pm.yml) ;;
            *) echo '::error::Unexpected recovery workflow'; exit 1 ;;
          esac
          gh workflow run "$WF_FILE" --repo "$REPO" --ref "$BRANCH"
      - name: Telegram recovery status
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISPATCH_RESULT: ${{ steps.dispatch.outcome }}
          FAILED_NAME: ${{ github.event.workflow_run.name }}
        run: |
          python - <<'PY'
          import os
          from alert import send_telegram
          outcome = 'dispatched' if os.environ['DISPATCH_RESULT'] == 'success' else 'FAILED to dispatch'
          if not send_telegram(f"⚠️ {os.environ['FAILED_NAME']}: scheduled run failed; automatic retry {outcome}. Check Actions for the actual recovery result."):
              raise SystemExit('Recovery notification failed or is not configured')
          PY
